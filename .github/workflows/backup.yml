name: Daily database backup

# Dumps the Supabase Postgres database once a day and uploads the result as a
# GitHub Actions artifact — NOT committed to git. schema.sql and data.sql
# (the latter is real row data) used to be committed into backups/, but that
# directory holding actual data in git history was exactly the problem
# backups/ being gitignored elsewhere in this repo was meant to prevent — a
# daily commit here would have quietly reintroduced it. This workflow has no
# `contents: write` permission and never runs a git command, so there is no
# path by which a run can push anything to the repository.
#
# To recover a backup: open this workflow's page under the repo's Actions
# tab, pick the run you want, and download the "db-backup" artifact from
# that run's summary page. Artifacts expire after retention-days below —
# they are not a permanent archive.
#
# One-time setup: add the database connection string as a repo secret named
# SUPABASE_DB_URL (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily (~03:30/04:30 in Oslo)
  workflow_dispatch: {}      # lets you trigger a run by hand from the Actions tab

permissions:
  contents: read             # no git write anywhere in this workflow — see comment above

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::Missing SUPABASE_DB_URL secret — see the workflow file header for setup"
            exit 1
          fi
          mkdir -p backups
          # Schema of every non-system schema (tables, RLS policies, functions, triggers…)
          supabase db dump --db-url "$DB_URL" -f backups/schema.sql
          # Row data only, using COPY (fast + clean to restore)
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f backups/data.sql
          echo "Backup run: $(date -u +'%Y-%m-%d %H:%M UTC')" > backups/last-run.txt

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backups/
          retention-days: 90
